<text x="150" y="1630" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="middle">Totals: 122 calculated outcomes and 94 non-evaluable outcomes (216 states).</text>
