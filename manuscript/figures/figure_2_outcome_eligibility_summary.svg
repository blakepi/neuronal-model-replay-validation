<text x="150" y="185" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="middle">Each outcome retains calculated values and explicit reasons for non-evaluability.</text>
<text x="150" y="517" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="middle">Spike-count error</text>
