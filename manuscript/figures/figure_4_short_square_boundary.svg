<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1700" viewBox="0 0 2600 1700" role="img" aria-labelledby="title desc">
<title id="title">Short Square strict boundary and post hoc sensitivity</title>
<desc id="desc">Short Square strict boundary and post hoc sensitivity</desc>
<rect width="2600" height="1700" fill="#FFFFFF"/>
<text x="150" y="100" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#1F4E79" text-anchor="start" dominant-baseline="middle">Short Square boundary sensitivity</text>
<text x="150" y="185" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#9E3D36" text-anchor="start" dominant-baseline="middle">Strict half-open interval is primary; +0.25 ms is post hoc.</text>
<text x="180" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222222" text-anchor="start" dominant-baseline="middle">Specimen / sweep</text>
<text x="950" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="middle">Strict primary count</text>
<text x="1350" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="middle">+0.25 ms count</text>
<text x="1750" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="middle">Threshold after offset</text>
<text x="2250" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222222" text-anchor="middle" dominant-baseline="middle">Upstroke at offset</text>
<rect x="130" y="460" width="2340" height="135" fill="#DCEAF4" stroke="#DCEAF4" stroke-width="1"/>
