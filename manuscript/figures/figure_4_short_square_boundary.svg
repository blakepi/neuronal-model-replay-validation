<text x="150" y="1500" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#222222" text-anchor="start" dominant-baseline="middle">The sensitivity does not replace the prespecified estimand or establish a protocol-general causal rule.</text>
